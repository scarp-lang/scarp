name: Experimental bare-metal smoke

on:
  push:
    branches: [main]
    paths:
      - 'experiments/bare-metal/**'
      - 'src/**'
      - 'examples/checked_elf64_function.*'
      - 'examples/native_bounded_entry.srp'
      - 'examples/native_aggregate_locals.srp'
      - 'examples/bare_metal_*.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/bare-metal-smoke.yml'
  pull_request:
    paths:
      - 'experiments/bare-metal/**'
      - 'src/**'
      - 'examples/checked_elf64_function.*'
      - 'examples/native_bounded_entry.srp'
      - 'examples/native_aggregate_locals.srp'
      - 'examples/bare_metal_*.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/bare-metal-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qemu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Install emulator and boot image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends grub-pc-bin grub-common xorriso mtools qemu-system-x86 ovmf
      - name: Boot Scarp-generated machine code
        run: bash experiments/bare-metal/smoke.sh
      - name: Boot Scarp-only x86-64 UEFI applications and kernel
        run: python3 experiments/bare-metal/uefi-smoke.py

