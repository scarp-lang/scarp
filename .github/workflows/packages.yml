name: Release packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  package:
    name: Package / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # BUILD-INFO.txt records the reviewable source commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Build, extract, and smoke-test package
        shell: pwsh
        run: ./scripts/package.ps1 -Target '${{ matrix.target }}'
      - name: Compare payloads from a clean second release build
        shell: pwsh
        run: |
          & cargo clean --release --target '${{ matrix.target }}'
          if ($LASTEXITCODE -ne 0) { throw 'Could not clean the first release build' }
          ./scripts/package.ps1 -Target '${{ matrix.target }}' -OutputDirectory 'target/rebuilt-dist'
          $python = if ($IsWindows) { 'python' } else { 'python3' }
          & $python ./scripts/verify-package-rebuild.py dist target/rebuilt-dist '${{ matrix.target }}' --require-byte-identical-archives
          if ($LASTEXITCODE -ne 0) { throw 'Release package payload is not reproducible' }
      - name: Upload verified archive and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scarp-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  verify_release:
    name: Release candidate / archives and source
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the exact package source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Download the three packages from this workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p target/release-verification
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir target/release-verification
      - name: Independently verify exact source and all packaged archives
        shell: bash
        env:
          SCARP_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SCARP_SOURCE_SHA"
          version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)"
          test -n "$version"
          python3 scripts/verify-release.py target/release-verification \
            --version "$version" --commit "$SCARP_SOURCE_SHA" \
            --source-directory . --write-manifest
          test "$(wc -l < target/release-verification/SHA256SUMS)" -eq 3
          cat target/release-verification/SHA256SUMS
