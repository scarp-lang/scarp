name: Rust checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  stable:
    name: Stable / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Validate source and examples
        shell: bash
        env:
          # Never treat a skipped native differential test as a passing gate.
          SCARP_REQUIRE_C: "1"
        run: sh scripts/check.sh --offline
      - name: Verify freestanding scalar objects
        if: runner.os == 'Linux'
        shell: bash
        env:
          SCARP_CC: clang
          SCARP_REQUIRE_C: "1"
          SCARP_FREESTANDING: "1"
        run: |
          command -v clang
          command -v readelf
          cargo test --locked --offline --test c_backend freestanding_scalar_object_has_no_undefined_symbols_when_requested -- --exact
      - name: Verify C differential behavior with GCC and Clang UBSan
        if: runner.os == 'Linux'
        shell: bash
        env:
          SCARP_REQUIRE_C: "1"
        run: |
          command -v gcc
          command -v clang
          SCARP_CC=gcc cargo test --locked --offline --test c_backend
          SCARP_CC=clang SCARP_C_SANITIZE=1 cargo test --locked --offline --test c_backend
      - name: Smoke-test benchmark workloads
        shell: bash
        run: |
          cargo bench --locked --offline --bench runtime -- --quick
          cargo bench --locked --offline --bench numerics -- --quick
          cargo bench --locked --offline --bench compiler -- --quick
          cargo bench --locked --offline --bench bigint -- --quick
      - name: Verify release and branch-maintenance tools
        if: runner.os == 'Linux'
        run: |
          python3 scripts/test_inspection_json.py target/debug/scarp
          python3 scripts/test_diagnostic_json.py target/debug/scarp
          python3 scripts/test_symbol_index_json.py target/debug/scarp
          python3 scripts/test_rms.py target/debug/scarp
          python3 scripts/test_sampled_calculus.py target/debug/scarp
          python3 scripts/test_bigint.py target/debug/scarp
          python3 -m unittest discover -s scripts -p 'test_*release*.py'
          python3 -m unittest discover -s scripts -p 'test_prune_branches.py'
      - name: Validate PowerShell check script
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check.ps1 -Offline

  minimum:
    name: Minimum Rust / 1.74.0
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install minimum Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.74.0
      - name: Test minimum toolchain
        run: cargo test --locked --offline
      - name: Build minimum toolchain
        run: cargo build --locked --offline
      - name: Test release mode on minimum Rust
        run: cargo test --locked --offline --release
      - name: Smoke-test interned type API on minimum Rust
        run: cargo run --locked --offline --example interned_types
      - name: Smoke-test benchmark on minimum Rust
        run: |
          cargo bench --locked --offline --bench runtime -- --quick
          cargo bench --locked --offline --bench numerics -- --quick
          cargo bench --locked --offline --bench compiler -- --quick
          cargo bench --locked --offline --bench bigint -- --quick
