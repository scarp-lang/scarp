[package]
name = "scarp"
version = "0.0.7-alpha.4"
edition = "2021"
rust-version = "1.74"
description = "The Scarp programming language prototype"
license = "Apache-2.0"
repository = "https://github.com/scarp-lang/scarp"
documentation = "https://scarp-lang.github.io/scarp-docs/"
publish = false

[lib]
name = "scarp"
path = "src/lib.rs"

[[bin]]
name = "scarp"
path = "src/main.rs"

[[bench]]
name = "runtime"
harness = false

[[bench]]
name = "numerics"
harness = false

[[bench]]
name = "compiler"
harness = false

[[bench]]
name = "bigint"
harness = false

[[bench]]
name = "lifetime"
harness = false

[[bench]]
name = "native_calls"
harness = false

[lints.rust]
unsafe_code = "forbid"
